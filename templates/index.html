<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Delay Prediction</title>
</head>
<body>
    <h1>Flight Delay Prediction</h1>
    <p>Welcome to the Flight Delay Prediction App!</p>
    <form method="post" action="/predict">
        <label for="air_time">Air Time (minutes):</label>
        <input type="text" id="air_time" name="air_time" required>
        <br><br>
        <label for="distance">Distance (miles):</label>
        <input type="text" id="distance" name="distance" required>
        <br><br>
        <input type="submit" value="Predict Delay">
    </form>

    {% if prediction %}
    <div class="result-box">
        <h3>Prediction Result:</h3>
        <p><strong>{{ prediction }}</strong></p>
    </div>
    {% endif %}
    
</body>
</html>
